<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1410"/>
      <stop offset="100%" stop-color="#162018"/>
    </linearGradient>
    <radialGradient id="g1" cx="78%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#3d5e45" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3d5e45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="10%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#c9795a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c9795a" stop-opacity="0"/>
