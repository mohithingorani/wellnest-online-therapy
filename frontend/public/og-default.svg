    <radialGradient id="g3" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e2e22" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e2e22" stop-opacity="0"/>
    </radialGradient>
    <!-- Card shadow -->
